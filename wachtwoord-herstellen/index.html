<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieuw wachtwoord instellen — Pauzeapp</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap');
  :root { --aubergine:#4C0D30; --oranje:#DD6822; --zand:#FBEFDD; --tekst-donker:#3D2010; --tekst-zacht:#72682B; --rood:#C0392B; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Nunito Sans',sans-serif; background:var(--zand); color:var(--tekst-donker); line-height:1.6; min-height:100vh; display:flex; flex-direction:column; }
  h1 { font-family:'Fraunces',serif; font-weight:500; line-height:1.15; }
  header { padding:24px 0; background:rgba(251,239,221,0.92); }
  .wrap { max-width:1100px; margin:0 auto; padding:0 24px; }
  .nav { display:flex; justify-content:space-between; align-items:center; }
  .logo { font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:var(--aubergine); text-decoration:none; }
  .logo span { color:var(--oranje); }
  .card-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; }
  .card { background:white; border-radius:24px; padding:48px; max-width:440px; width:100%; box-shadow:0 8px 32px rgba(76,13,48,0.08); }
  .card h1 { font-size:32px; color:var(--aubergine); margin-bottom:8px; }
  .card .sub { color:var(--tekst-zacht); margin-bottom:32px; font-size:16px; }
  .form-group { margin-bottom:20px; position:relative; }
  label { display:block; font-weight:600; font-size:13px; color:var(--aubergine); margin-bottom:6px; letter-spacing:0.5px; }
  input { width:100%; padding:14px 18px; border:2px solid #EADBC4; border-radius:14px; font-family:inherit; font-size:15px; background:#FFFBF3; color:var(--tekst-donker); }
  input:focus { outline:none; border-color:var(--oranje); }
  .toggle-pw { position:absolute; right:14px; top:38px; background:none; border:none; cursor:pointer; color:var(--tekst-zacht); padding:4px; font-size:13px; }
  .btn-primary { background:var(--oranje); color:white; padding:16px 34px; border-radius:999px; border:none; font-family:inherit; font-weight:700; font-size:16px; cursor:pointer; width:100%; margin-top:8px; }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
  .alt { text-align:center; margin-top:24px; font-size:14px; color:var(--tekst-zacht); }
  .alt a { color:var(--oranje); font-weight:600; text-decoration:none; }
  .error { background:rgba(192,57,43,0.1); color:var(--rood); padding:12px 16px; border-radius:12px; font-size:14px; margin-bottom:16px; display:none; }
  .error.actief { display:block; }
  .success { background:rgba(82,183,136,0.15); color:#2D7044; padding:12px 16px; border-radius:12px; font-size:14px; margin-bottom:16px; display:none; }
  .success.actief { display:block; }
  footer { padding:24px; text-align:center; font-size:13px; color:var(--tekst-zacht); }
  footer a { color:var(--tekst-zacht); text-decoration:none; }
</style>
</head>
<body>
<header><div class="wrap"><div class="nav">
  <a href="/" class="logo">Pauze<span>app</span></a>
  <a href="/login" style="color:var(--aubergine); font-weight:600; text-decoration:none;">Inloggen →</a>
</div></div></header>
<div class="card-wrap"><div class="card">
  <h1>Nieuw wachtwoord</h1>
  <p class="sub">Kies een nieuw wachtwoord voor je Pauzeapp-account.</p>
  <div id="error" class="error"></div>
  <div id="success" class="success"></div>
  <form id="herstel-form">
    <div class="form-group">
      <label for="wachtwoord">NIEUW WACHTWOORD</label>
      <input type="password" id="wachtwoord" placeholder="Minstens 8 tekens" required minlength="8">
      <button type="button" class="toggle-pw" id="toggle-pw">Tonen</button>
    </div>
    <div class="form-group">
      <label for="wachtwoord2">HERHAAL WACHTWOORD</label>
      <input type="password" id="wachtwoord2" placeholder="Nog een keer" required minlength="8">
    </div>
    <button type="submit" class="btn-primary" id="submit-btn">Wachtwoord opslaan →</button>
  </form>
  <p class="alt">Weet je het wachtwoord weer? <a href="/login">Inloggen</a></p>
</div></div>
<footer><p>© 2026 Pauzeapp · <a href="/voorwaarden">Voorwaarden</a> · <a href="/privacy">Privacy</a></p></footer>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient('https://zxlqnofdhyzwnuggtbsa.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4bHFub2ZkaHl6d251Z2d0YnNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0ODE0NDksImV4cCI6MjA5MTA1NzQ0OX0.RtkOBLV8oxawDGRfvq-H0iBlDQJN541E_d5q3RlUsag');
  const form=document.getElementById("herstel-form"),errorEl=document.getElementById("error"),successEl=document.getElementById("success"),submitBtn=document.getElementById("submit-btn"),togglePw=document.getElementById("toggle-pw"),pwInput=document.getElementById("wachtwoord"),pwInput2=document.getElementById("wachtwoord2");
  function toonError(t){errorEl.textContent=t;errorEl.classList.add("actief");successEl.classList.remove("actief");}
  function toonSuccess(t){successEl.textContent=t;successEl.classList.add("actief");errorEl.classList.remove("actief");}
  function verberg(){errorEl.classList.remove("actief");successEl.classList.remove("actief");}
  togglePw.addEventListener("click",()=>{const t=pwInput.type==="password"?"text":"password";pwInput.type=t;pwInput2.type=t;togglePw.textContent=t==="text"?"Verbergen":"Tonen";});
  setTimeout(async()=>{const{data:{session}}=await supabase.auth.getSession();if(!session)toonError("Deze herstel-link is verlopen of ongeldig. Vraag op de inlogpagina een nieuwe aan.");},1500);
  form.addEventListener("submit",async(e)=>{e.preventDefault();verberg();const w=pwInput.value,w2=pwInput2.value;if(w.length<8){toonError("Je wachtwoord moet minstens 8 tekens zijn.");return;}if(w!==w2){toonError("De twee wachtwoorden zijn niet hetzelfde.");return;}submitBtn.disabled=true;submitBtn.textContent="Bezig...";try{const{error}=await supabase.auth.updateUser({password:w});if(error)throw error;toonSuccess("Je wachtwoord is aangepast! Je wordt doorgestuurd naar de inlogpagina...");setTimeout(()=>{window.location.href="/login";},2500);}catch(err){toonError(err.message||"Er ging iets mis. Vraag eventueel een nieuwe herstel-link aan.");submitBtn.disabled=false;submitBtn.textContent="Wachtwoord opslaan →";}});
</script>
</body>
</html>
